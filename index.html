<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>ProjectNest — Your tools, one place</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--line:#293752;--fg:#edf2ff;--muted:#9baac5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#1d2c4e 0,transparent 42%),var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:42px 22px 55px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#8298ff,#9d74e9);display:grid;place-items:center;font-size:22px;font-weight:800}h1{font-size:clamp(30px,5vw,43px);margin:25px 0 7px}.intro{color:var(--muted);max-width:600px}.section{display:flex;justify-content:space-between;margin:38px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:17px}.app{background:linear-gradient(145deg,#192640,#121b2d);border:1px solid var(--line);border-radius:19px;padding:21px;min-height:205px;display:flex;flex-direction:column}.apphead{display:flex;align-items:center;gap:13px}.appicon{width:49px;height:49px;border-radius:14px;background:#29395d;display:grid;place-items:center;font-size:24px;overflow:hidden}.appicon img{width:100%;height:100%;object-fit:cover}.app h3{margin:0;font-size:18px}.kind,.count{font-size:12px;color:var(--muted)}.desc{color:#b2bfd7;font-size:13px;margin:19px 0 22px}.actions{margin-top:auto}.open{display:inline-block;background:#879bff;color:#10172b;text-decoration:none;font-weight:700;padding:10px 15px;border-radius:10px}.state{grid-column:1/-1;padding:26px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}.note{text-align:center;color:#71819f;font-size:12px;margin-top:28px}.admin-link{display:inline-block;margin-top:10px;color:#71819f;text-decoration:none;border:1px solid #293752;border-radius:8px;padding:6px 11px}.admin-link:hover{color:#dce5ff;border-color:#6579ad}@media(max-width:560px){main{padding:29px 16px 42px}}
</style></head><body><main><header><div class="brand"><div class="logo">P</div><strong>ProjectNest</strong></div><h1>Your tools. One place.</h1><p class="intro">A simple home for finished web apps. Pick a tool and open it directly — no repository links, no clutter.</p></header><div class="section"><strong>Available apps</strong><span class="count" id="count">Loading…</span></div><section class="grid" id="apps"><div class="state">Loading your apps…</div></section><p class="note">A home for useful tools, built and maintained in one place.<br><a class="admin-link" href="./admin.html">Admin access</a></p></main>
<script>
const API='https://owsmrnykkrdauueqcbsi.supabase.co/rest/v1/apps',KEY='sb_publishable_OJfuH-lWx_8jR_Zms2MlkQ_XfdH89yR';
const grid=document.getElementById('apps'),count=document.getElementById('count');
function makeCard(a){const el=document.createElement('article');el.className='app';const head=document.createElement('div');head.className='apphead';const icon=document.createElement('div');icon.className='appicon';if(a.logo_url){const img=document.createElement('img');img.src=a.logo_url;img.alt='';img.onerror=()=>icon.textContent=a.icon||'🌐';icon.append(img)}else icon.textContent=a.icon||'🌐';const info=document.createElement('div'),name=document.createElement('h3'),kind=document.createElement('span');name.textContent=a.name;kind.className='kind';kind.textContent='Web app';info.append(name,kind);head.append(icon,info);const desc=document.createElement('p');desc.className='desc';desc.textContent=a.description||'Open this app from your ProjectNest dashboard.';const actions=document.createElement('div');actions.className='actions';const link=document.createElement('a');link.className='open';link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Open App ↗';actions.append(link);el.append(head,desc,actions);return el}
async function load(){try{const r=await fetch(API+'?select=id,name,url,description,icon,logo_url,sort_order&published=eq.true&order=sort_order.asc,name.asc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error('Request failed');const apps=await r.json();grid.replaceChildren();count.textContent=apps.length+' app'+(apps.length===1?'':'s');if(!apps.length){const e=document.createElement('div');e.className='state';e.textContent='No apps published yet. Check back soon.';grid.append(e)}else apps.forEach(a=>grid.append(makeCard(a)))}catch(e){grid.replaceChildren();const x=document.createElement('div');x.className='state';x.textContent='Could not load apps right now. Please refresh in a moment.';grid.append(x);count.textContent='Unavailable';console.error(e)}}load();
</script></body></html>
