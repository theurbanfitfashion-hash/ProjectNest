<style>
:root{color-scheme:dark;--bg:#0b1020;--line:#293752;--fg:#edf2ff;--muted:#9baac5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:42px 22px 55px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:#202022;display:grid;place-items:center;font-size:22px;font-weight:800}h1{font-size:clamp(30px,5vw,43px);margin:25px 0 7px}.intro{color:var(--muted);max-width:600px}.section{display:flex;justify-content:space-between;margin:38px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:17px}.app{background:#1b1b1d;border:1px solid var(--line);border-radius:19px;padding:21px;min-height:205px;display:flex;flex-direction:column}.apphead{display:flex;align-items:center;gap:13px}.appicon{width:49px;height:49px;border-radius:14px;background:#29395d;display:grid;place-items:center;font-size:24px;overflow:hidden}.appicon img{width:100%;height:100%;object-fit:cover}.app h3{margin:0;font-size:18px}.kind,.count{font-size:12px;color:var(--muted)}.desc{color:#b2bfd7;font-size:13px;margin:19px 0 22px}.actions{margin-top:auto}.open{display:inline-block;background:#879bff;color:#10172b;text-decoration:none;font-weight:700;padding:10px 15px;border-radius:10px}.state{grid-column:1/-1;padding:26px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}.note{text-align:center;color:#71819f;font-size:12px;margin-top:28px}.admin-link{display:inline-block;margin-top:10px;color:#71819f;text-decoration:none;border:1px solid #293752;border-radius:8px;padding:6px 11px}.admin-link:hover{color:#dce5ff;border-color:#6579ad}@media(max-width:560px){main{padding:29px 16px 42px}}
:root{color-scheme:dark;--bg:#141415;--line:rgba(237,237,237,.09);--fg:#ededed;--muted:#aaaab0}
body{background:#141415;color:#ededed;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
main{max-width:1120px;padding:32px 22px 48px}
.logo{background:transparent;border:0;color:#a7c4bb;border-radius:9px;font-size:16px;font-weight:500}.brand-mark svg{width:42px;height:42px;display:block}
h1{font-size:clamp(34px,5vw,52px);font-weight:500;letter-spacing:-.035em;line-height:1.08;margin:0 0 16px}
.intro{color:#aaaab0;font-size:16px;line-height:1.65}

.section{align-items:baseline;margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.app{background:#1b1b1d;border:1px solid var(--line);border-radius:16px;padding:20px;min-height:196px;transition:background .16s,border-color .16s}
.app:hover{background:#202022;border-color:rgba(237,237,237,.17)}
.appicon{width:44px;height:44px;border-radius:11px;background:#242426;border:1px solid var(--line);color:#a7c4bb;font-size:16px;font-weight:500}
.app h3{font-size:16px;font-weight:500}.desc{color:#aaaab0;font-size:13px;line-height:1.55}
.open{background:#e7e9e6;color:#191b19;border-radius:9px;font-size:13px;font-weight:500;padding:10px 14px}.open:hover{background:#fff}
.state{border-radius:12px;border-color:rgba(237,237,237,.16);color:#aaaab0}
.note{display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;color:#85858b;border-top:1px solid var(--line);padding-top:18px;margin-top:56px;font-size:12px}

/* ProjectNest visual refresh */
body{background:radial-gradient(ellipse at 50% -20%,#20243b 0%,#101116 48%,#0c0d12 100%);color:#f3f4fa}

</style></head><body><main><header><div class="brand"><div class="logo brand-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="pn" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28c7f5"/><stop offset="1" stop-color="#8a55df"/></linearGradient></defs><path d="M32 3 57 17v30L32 61 7 47V17z" fill="url(#pn)"/><path d="M21 18h17l10 9v19L21 57z" fill="#11131c"/><path d="M28 29h9l5 5v7L28 50z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg></div><strong>ProjectNest</strong></div><section class="hero"><p class="eyebrow">YOUR APP LIBRARY</p><h1>Your apps. One place.</h1><p class="intro">Access your favorite web apps from one simple, organized dashboard.</p></section></header><div class="section"><div><strong>Your Apps</strong><div class="intro">Access your favorite web apps from one place.</div></div><div class="dashboard-tools"><input id="appSearch" type="search" placeholder="Search apps…" aria-label="Search apps"><select id="appSort" aria-label="Sort apps"><option value="default">Default order</option><option value="az">A to Z</option><option value="za">Z to A</option></select><span class="count" id="count">Loading…</span></div></div><section class="grid" id="apps"><div class="state">Loading your apps…</div></section><footer class="note"><span>ProjectNest — A collection of useful web apps in one place.</span><a class="admin-link" href="./admin.html">Admin access</a><!-- Adapted UI design guidance from Unslop by Damir Sokolovsky (https://github.com/heydamir/unslop), licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). Changes made: adapted styling and layout for ProjectNest. --></footer></main>
<script>
const API='https://owsmrnykkrdauueqcbsi.supabase.co/rest/v1/apps',KEY='sb_publishable_OJfuH-lWx_8jR_Zms2MlkQ_XfdH89yR';
const grid=document.getElementById('apps'),count=document.getElementById('count');let allApps=[];const search=document.getElementById('appSearch'),sort=document.getElementById('appSort');
function makeCard(a){const el=document.createElement('article');el.className='app';const head=document.createElement('div');head.className='apphead';const icon=document.createElement('div');icon.className='appicon';if(a.logo_url){const img=document.createElement('img');img.src=a.logo_url;img.alt='';img.onerror=()=>icon.textContent=(a.name||'A').trim().charAt(0).toUpperCase();icon.append(img)}else icon.textContent=a.icon||'🌐';const info=document.createElement('div'),name=document.createElement('h3'),kind=document.createElement('span');name.textContent=a.name;kind.className='kind';kind.textContent='Web app';info.append(name,kind);head.append(icon,info);const desc=document.createElement('p');desc.className='desc';desc.textContent=a.description||'Open this app from your ProjectNest dashboard.';const actions=document.createElement('div');actions.className='actions';const link=document.createElement('a');link.className='open';link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Open app ↗';actions.append(link);el.append(head,desc,actions);return el}
function renderApps(){let rows=allApps.filter(a=>(a.name+' '+(a.description||'')).toLowerCase().includes(search.value.trim().toLowerCase()));if(sort.value==='az')rows.sort((a,b)=>a.name.localeCompare(b.name));if(sort.value==='za')rows.sort((a,b)=>b.name.localeCompare(a.name));grid.replaceChildren();count.textContent=rows.length+' app'+(rows.length===1?'':'s');if(!rows.length){const e=document.createElement('div');e.className='state';e.textContent=allApps.length?'No apps match your search.':'No apps published yet. Check back soon.';grid.append(e)}else rows.forEach(a=>grid.append(makeCard(a)))}search.addEventListener('input',renderApps);sort.addEventListener('change',renderApps);document.getElementById('previewLogo').onclick=()=>{const result=document.getElementById('logoResult');let u;try{u=new URL(document.getElementById('logoUrl').value.trim());if(!['http:','https:'].includes(u.protocol))throw Error()}catch{result.innerHTML='<div><strong>Enter a valid website URL</strong><small>Include https://</small></div>';return}const candidates=[u.origin+'/apple-touch-icon.png',u.origin+'/favicon.ico','https://www.google.com/s2/favicons?domain='+encodeURIComponent(u.hostname)+'&sz=128'];const img=document.createElement('img');img.alt='Retrieved app logo';img.src=candidates[0];img.onerror=()=>{img.onerror=()=>{img.src=candidates[2];img.onerror=()=>{result.textContent='No icon preview available. Try adding a logo from Admin.'}};img.src=candidates[1]};result.replaceChildren(img);const label=document.createElement('div');label.innerHTML='<strong>'+u.hostname.replace(/[&<>]/g,'')+'</strong><small>Logo preview</small>';result.append(label)};async function load(){try{const r=await fetch(API+'?select=id,name,url,description,icon,logo_url,sort_order&published=eq.true&order=sort_order.asc,name.asc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error('Request failed');allApps=await r.json();renderApps()}catch(e){grid.replaceChildren();const x=document.createElement('div');x.className='state';x.textContent='Could not load apps right now. Please refresh in a moment.';grid.append(x);count.textContent='Unavailable';console.error(e)}}load();
</script></body></html>
