<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>ProjectNest Admin</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141f33;--line:#293752;--fg:#edf2ff;--muted:#9baac5;--accent:#9eafff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#1d2c4e 0,transparent 42%),var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:30px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800}.brand span{display:inline-grid;place-items:center;background:linear-gradient(135deg,#8298ff,#9d74e9);width:36px;height:36px;border-radius:11px;margin-right:8px}h1{font-size:30px;margin:28px 0 5px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}.hidden{display:none!important}label{display:block;color:#b9c5dc;font-size:12px;margin:12px 0 5px}input,textarea{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #354664;background:#0d1728;color:var(--fg);font:14px system-ui}textarea{min-height:65px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;background:#879bff;color:#10172b;margin-top:14px}.secondary{background:#293752;color:#e5ebfb}.danger{background:#653b4a;color:#fff}.status{min-height:22px;color:#b9c9ff;font-size:13px;margin-top:10px}.approw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.approw:last-child{border:0}.appname{font-weight:700}.small{font-size:12px;color:var(--muted)}.tools{display:flex;gap:7px;flex-wrap:wrap}.tools button{margin:0;padding:7px 10px}.check{display:flex;align-items:center;gap:8px;margin-top:12px}.check input{width:auto}.links a{color:#b8c7ff}@media(max-width:600px){.row{grid-template-columns:1fr}.approw{align-items:flex-start;flex-direction:column}.tools{width:100%}}
</style></head><body><main>
<div class="top"><div class="brand"><span>P</span>ProjectNest / Admin</div><a href="./" class="muted">← Public dashboard</a></div>
<h1>Manage your apps</h1><p class="muted">Add finished tools, update their details, and choose which ones appear on the public dashboard.</p>
<section class="panel" id="authPanel"><h2 id="authTitle">Administrator sign in</h2><p class="muted" id="authHelp">Use the administrator email configured for this ProjectNest hub.</p>
<form id="authForm"><label>Email</label><input id="email" type="email" autocomplete="username" required value="theurbanfitfashion@gmail.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button class="btn" id="authSubmit">Sign in</button></form>
<button class="btn secondary" id="mode">Create administrator account</button><div class="status" id="authStatus" role="status"></div></section>
<section class="hidden" id="manager">
<div class="panel"><div class="top"><h2 id="formTitle">Add a new app</h2><button class="btn secondary" id="logout">Sign out</button></div>
<form id="appForm"><input id="appId" type="hidden"><div class="row"><div><label>App name *</label><input id="name" maxlength="60" required placeholder="StudyTrack"></div><div><label>App website URL *</label><input id="url" type="url" required placeholder="https://your-app.example.com"></div></div>
<label>Description</label><textarea id="description" maxlength="180" placeholder="What does this tool do?"></textarea>
<div class="row"><div><label>Emoji icon</label><input id="icon" maxlength="8" value="🌐"></div><div><label>Logo image URL (optional)</label><input id="logo" type="url" placeholder="https://…"></div></div>
<div class="row"><div><label>Sort order (lower appears first)</label><input id="sort" type="number" value="0"></div><label class="check"><input id="published" type="checkbox"> Publish on public dashboard</label></div>
<button class="btn" id="save">Save app</button><button class="btn secondary hidden" id="cancelEdit" type="button">Cancel edit</button><div class="status" id="formStatus" role="status"></div></form></div>
<div class="panel"><h2>App library</h2><div id="list" class="muted">Loading…</div></div>
</section>
</main>
<script>
const BASE='https://owsmrnykkrdauueqcbsi.supabase.co',KEY='sb_publishable_OJfuH-lWx_8jR_Zms2MlkQ_XfdH89yR',ADMIN='theurbanfitfashion@gmail.com';
let token=sessionStorage.getItem('pn_admin_token')||'',signup=false;
const $=id=>document.getElementById(id);
async function request(path,options={}){const headers={apikey:KEY,'Content-Type':'application/json',...(options.headers||{})};if(token)headers.Authorization='Bearer '+token;else headers.Authorization='Bearer '+KEY;const r=await fetch(BASE+path,{...options,headers});const body=await r.text();let data;try{data=body?JSON.parse(body):null}catch{data=body}if(!r.ok)throw Error(data?.msg||data?.message||data?.hint||data?.error_description||'Request failed ('+r.status+')');return data}
function showManager(){ $('authPanel').classList.add('hidden');$('manager').classList.remove('hidden');loadApps()}
function showAuth(){token='';sessionStorage.removeItem('pn_admin_token');$('manager').classList.add('hidden');$('authPanel').classList.remove('hidden')}
$('mode').onclick=()=>{signup=!signup;$('authTitle').textContent=signup?'Create administrator account':'Administrator sign in';$('authSubmit').textContent=signup?'Create account':'Sign in';$('mode').textContent=signup?'Back to sign in':'Create administrator account';$('authStatus').textContent='';};
$('authForm').onsubmit=async e=>{e.preventDefault();$('authStatus').textContent='Please wait…';try{const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(email!==ADMIN)throw Error('This admin page is restricted to the configured administrator email.');let data;if(signup){data=await request('/auth/v1/signup?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',body:JSON.stringify({email,password})});if(!data.access_token){$('authStatus').textContent='Account created. Check your email and confirm the address, then return here to sign in.';return}}else data=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});token=data.access_token;sessionStorage.setItem('pn_admin_token',token);$('authStatus').textContent='';showManager()}catch(err){$('authStatus').textContent=err.message}};
$('logout').onclick=showAuth;
function resetForm(){$('appForm').reset();$('appId').value='';$('icon').value='🌐';$('sort').value='0';$('formTitle').textContent='Add a new app';$('save').textContent='Save app';$('cancelEdit').classList.add('hidden')}
function escapeText(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadApps(){try{const rows=await request('/rest/v1/apps?select=*&order=sort_order.asc,name.asc');$('list').innerHTML='';if(!rows.length){$('list').textContent='No apps yet. Add your first finished tool above.';return}rows.forEach(a=>{const row=document.createElement('div');row.className='approw';const info=document.createElement('div');info.innerHTML='<div class="appname">'+escapeText(a.icon||'🌐')+' '+escapeText(a.name)+'</div><div class="small">'+(a.published?'Published':'Draft')+' · '+escapeText(a.url)+'</div>';const tools=document.createElement('div');tools.className='tools';const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='Edit';edit.onclick=()=>editApp(a);const pub=document.createElement('button');pub.className='btn secondary';pub.textContent=a.published?'Unpublish':'Publish';pub.onclick=()=>updateApp(a.id,{published:!a.published});const del=document.createElement('button');del.className='btn danger';del.textContent='Delete';del.onclick=()=>deleteApp(a.id,a.name);tools.append(edit,pub,del);row.append(info,tools);$('list').append(row)})}catch(e){$('list').textContent=e.message}}
function editApp(a){$('appId').value=a.id;$('name').value=a.name;$('url').value=a.url;$('description').value=a.description||'';$('icon').value=a.icon||'🌐';$('logo').value=a.logo_url||'';$('sort').value=a.sort_order||0;$('published').checked=a.published;$('formTitle').textContent='Edit app';$('save').textContent='Update app';$('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
async function updateApp(id,patch){try{await request('/rest/v1/apps?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({...patch,updated_at:new Date().toISOString()})});loadApps()}catch(e){alert(e.message)}}
async function deleteApp(id,name){if(!confirm('Delete '+name+' from ProjectNest?'))return;try{await request('/rest/v1/apps?id=eq.'+encodeURIComponent(id),{method:'DELETE'});loadApps()}catch(e){alert(e.message)}}
$('appForm').onsubmit=async e=>{e.preventDefault();$('formStatus').textContent='Saving…';try{const url=new URL($('url').value.trim());if(!['https:','http:'].includes(url.protocol))throw Error('Use an http or https app URL.');const payload={name:$('name').value.trim(),url:url.href,description:$('description').value.trim(),icon:$('icon').value.trim()||'🌐',logo_url:$('logo').value.trim(),sort_order:Number($('sort').value)||0,published:$('published').checked,updated_at:new Date().toISOString()};if($('appId').value)await request('/rest/v1/apps?id=eq.'+encodeURIComponent($('appId').value),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});else await request('/rest/v1/apps',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});resetForm();$('formStatus').textContent='Saved successfully.';loadApps()}catch(err){$('formStatus').textContent=err.message}};
$('cancelEdit').onclick=resetForm;
if(token){request('/auth/v1/user').then(u=>{if((u.email||'').toLowerCase()===ADMIN)showManager();else showAuth()}).catch(showAuth)}
</script></body></html>
